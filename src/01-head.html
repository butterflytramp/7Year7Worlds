<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7 Years 7 Worlds — How About That!</title>
<meta name="description" content="Seven years. Seven worlds. The last one: ours. A year-long series of navigable worlds by Studio How About That!">
<meta property="og:type" content="website">
<meta property="og:site_name" content="How About That!">
<meta property="og:title" content="7 Years 7 Worlds">
<meta property="og:description" content="Seven years. Seven worlds. The last one: ours. Enter here.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fbfaf7'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-style='italic' font-size='34' fill='%23c2542e' text-anchor='middle'%3E7%3C/text%3E%3C/svg%3E">
<style>
  /* ----------------------------------------------------------------
     NAZARENA — the portal's face. Subset to the characters the build
     actually sets and inlined as WOFF, so the page carries its own
     typography and needs no font CDN.
     One static weight was supplied (400, no italic, no variable axes),
     so hierarchy is made with size, tracking, case and colour rather
     than with weights the family does not have. It is a unicase deco
     face — lowercase draws as capitals — which is why nothing here is
     ever set in italic and why tracking stays generous.
     ---------------------------------------------------------------- */
  @font-face{
    font-family:'Nazarena';
    src:url(__ASSET:Nazarena.woff__) format('woff');
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --display:'Nazarena',Georgia,'Times New Roman',serif;
    --plain:'Nazarena',Georgia,'Times New Roman',serif;
    --fallback:ui-sans-serif,system-ui,'Segoe UI',sans-serif;
    --paper:#fbfaf7; --ink:#1c1c1a; --ink2:#5f5c54; --faint:#b8b4a8;
    --clay:#c2542e; --navy:#0b2447;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#efebe3;color:var(--ink);
    font-family:var(--plain);overflow-x:hidden}
  ::selection{background:#c2542e33}
  .serif{font-family:var(--display);font-weight:400}
  .mono{font-family:var(--display);letter-spacing:.06em}

  #scene{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
  #grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.28;
    background-image:radial-gradient(rgba(28,28,26,.05) 1px,transparent 1px);
    background-size:5px 5px}
  #scroll-space{position:relative;z-index:1;width:100%;height:1900vh}

  /* ---------- the way in: darkness, a line of light, the museum ---------- */
  #reveal{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
  #reveal .half{position:absolute;top:0;bottom:0;width:50.5%;background:#06050a;will-change:transform}
  #reveal .l{left:0}  #reveal .r{right:0}
  #reveal .line{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;
    background:#fff;opacity:0;box-shadow:0 0 18px 4px rgba(255,250,240,.9),0 0 80px 20px rgba(255,240,220,.5)}

  /* ---------- placards & copy ---------- */
  .act{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:10vh 8vw;gap:1.2rem;
    opacity:0;pointer-events:none;transition:opacity .7s ease;will-change:opacity}
  .act.active{opacity:1}
  .act p.story{font-family:var(--display);
    font-size:clamp(1.5rem,3.2vw,2.5rem);line-height:1.45;color:var(--ink);max-width:880px}
  .act .thesis{font-family:var(--display);
    font-size:clamp(2.4rem,7vw,5.6rem);line-height:1.15;color:var(--ink);max-width:1000px}
  .act .lbl{font-family:var(--display);font-size:.72rem;
    letter-spacing:.30em;color:var(--ink);text-transform:uppercase}
  .act .lbl b{color:var(--ink);font-weight:500}

  /* world placards: small, bottom-left, precise */
  .act.doorlbl{justify-content:flex-end;align-items:flex-start;text-align:left;
    padding:0 0 11vh 4.5vw;gap:.55rem}
  .plaq{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;
    max-width:430px;padding:.2rem 0 .2rem 1.1rem;border-left:1px solid rgba(28,28,26,.5)}
  .plaq .lbl{transition:color .6s ease}
  /* legibility over dark stretches without a visible plate: the halo is the
     paper colour, so it vanishes against the walls and only reads over dark */
  .plaq .num,.plaq .lbl,.plaq .thesis,.plaq p.story,.plaq .enter{
    text-shadow:0 0 3px rgba(251,250,247,.92),0 0 12px rgba(251,250,247,.75)}
  .plaq{box-shadow:-1px 0 10px rgba(251,250,247,.55)}
    .plaq .num{font-family:var(--display);
    font-size:2.35rem;line-height:1;color:var(--ink);transition:color .6s}
  .plaq p.story,.plaq .thesis{color:#3a362e;font-size:clamp(1rem,1.4vw,1.2rem)}
  .plaq .thesis{font-size:clamp(1.25rem,2vw,1.7rem);line-height:1.35;max-width:360px}
  .plaq .enter{font-family:var(--display);font-size:.66rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--ink2);opacity:0;transition:opacity .5s}
  .plaq.near .enter{opacity:1}
  .w01.tint .num,.w01.tint .lbl{color:#2f5cff}
  .w02.tint .num,.w02.tint .lbl{color:#ff3366}
  .w03.tint .num,.w03.tint .lbl{color:#1f8fb0}
  .invite{display:flex;gap:16px;align-items:center;margin-top:.4rem}
  .invite img{width:98px;height:98px;border:1px solid rgba(28,28,26,.15);border-radius:8px;display:block}
  .invite .txt{font-family:var(--display);font-size:.68rem;letter-spacing:.18em;line-height:2;color:var(--ink2)}
  /* The invite is the numeral's material: the sharp light-to-dark band across
     the middle is what makes a flat gradient read as polished metal. */
  .plaq.chrome{border-left:none;padding:1.15rem 1.35rem .95rem;border-radius:3px;
    background:linear-gradient(163deg,#fdfdfe 0%,#e9ecf0 13%,#c4c9d1 29%,
      #8f959f 45%,#70767f 51%,#babdc3 57%,#e7e4de 71%,#d4cfc5 85%,#f3f0ea 100%);
    box-shadow:0 6px 22px rgba(40,42,48,.26),
      inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(60,64,72,.42);
    opacity:0;transform:translateY(10px);
    transition:opacity .9s ease,transform .9s cubic-bezier(.16,.72,.2,1)}
  /* item 9: it is what is behind the last door, so it arrives with it */
  html.door7-open .plaq.chrome{opacity:1;transform:none}
  .plaq.chrome .lbl,.plaq.chrome .num{color:#2a2d33;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .plaq.chrome .thesis,.plaq.chrome p.story{color:#1c1e22;text-shadow:0 1px 0 rgba(255,255,255,.45)}
  .plaq.chrome p.story strong{color:#0e0f12}
  .plaq.chrome .invite .txt{color:#2a2d33;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  /* the code has to stay scannable, so it keeps a flat white plate */
  .plaq.chrome .invite img{background:#fff;padding:5px;border:0;
    box-shadow:0 1px 4px rgba(30,32,38,.35)}

  /* custom cursors on portal hover */
  body.cur-w01{cursor:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='36' height='36'%3E%3Cpath d='M18 4a14 14 0 1 0 12.1 21L18 18z' fill='%23ffed4e'/%3E%3Ccircle cx='21' cy='11' r='2' fill='%230a0f1f'/%3E%3C/svg%3E") 18 18, pointer}
  body.cur-w02{cursor:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='36' height='36'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='0.45' stop-color='%23c8ccd4'/%3E%3Cstop offset='1' stop-color='%235a616e'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='18' cy='18' r='13' fill='url(%23g)'/%3E%3Cellipse cx='13' cy='12' rx='4' ry='2.6' fill='%23ffffff' opacity='0.85'/%3E%3C/svg%3E") 18 18, pointer}
  body.cur-w03{cursor:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='36' height='36'%3E%3Ccircle cx='18' cy='18' r='12' fill='none' stroke='%23c9ecf7' stroke-width='2'/%3E%3Ccircle cx='18' cy='18' r='3' fill='%231f8fb0'/%3E%3C/svg%3E") 18 18, pointer}
  body.cur-soon{cursor:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='36' height='36'%3E%3Ccircle cx='18' cy='18' r='11' fill='none' stroke='%231c1c1a' stroke-width='1.2'/%3E%3Cpath d='M18 11v7l5 3' fill='none' stroke='%231c1c1a' stroke-width='1.2'/%3E%3C/svg%3E") 18 18, pointer}

  /* ---------- footer index ---------- */
  #act-footer{justify-content:center;gap:2.2rem}
  #act-footer.active{pointer-events:auto}
  .idx{display:flex;flex-direction:column;gap:.55rem;width:min(560px,88vw);
    font-family:var(--display);font-size:.92rem;letter-spacing:.12em}
  .idx a,.idx .row{display:flex;justify-content:space-between;align-items:center;
    padding:.75rem .4rem;border-bottom:1px solid rgba(28,28,26,.14);
    color:var(--ink);text-decoration:none;letter-spacing:.1em}
  .idx a:hover{background:rgba(194,84,46,.06)}
  .idx a .st{color:var(--navy)}
  .idx .row{color:var(--faint)}
  .idx .row .st{color:var(--faint);letter-spacing:.2em}
  .idx .row.next{color:var(--ink2)}
  .idx .row.w7{color:var(--ink)}
  .idx .row.w7 .st{color:var(--clay)}
  .passport{display:flex;gap:12px;align-items:center}
  .passport i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);display:inline-block}
  .passport i.got{background:var(--clay);border-color:var(--clay)}
  .credit{font-family:var(--display);font-size:.74rem;letter-spacing:.24em;color:var(--ink2);text-transform:uppercase}

  #soon{position:fixed;z-index:6;pointer-events:none;opacity:0;
    font-family:var(--display);font-size:.8rem;color:var(--paper);
    background:var(--ink);padding:.35rem .9rem;border-radius:6px;transition:opacity .25s}
  #soon.on{opacity:1}
  #whiteout{position:fixed;inset:0;z-index:2;background:var(--paper);opacity:0;pointer-events:none}
  #veil{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:#fff}

  .hint{position:fixed;bottom:9vh;left:0;right:0;z-index:3;text-align:center;
    font-family:var(--display);font-size:.7rem;letter-spacing:.34em;
    color:var(--ink2);text-transform:uppercase;
    animation:pulse 2.8s ease-in-out infinite;pointer-events:none;transition:opacity .5s}
  .hint.off{animation:none;opacity:0}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.85}}

  /* ---------- museum navigation: 01 —— 02 —— … —— 07 ---------- */
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;
    gap:22px;padding:14px 22px 16px;pointer-events:none;
    font-family:var(--display);font-size:.66rem;letter-spacing:.2em;color:var(--ink2);
    text-shadow:0 0 3px rgba(251,250,247,.9),0 0 10px rgba(251,250,247,.7);
    opacity:0;transition:opacity .8s}
  #nav.on{opacity:1}
  #nav .brand{white-space:nowrap;color:var(--ink)}
  #nav .rail{flex:1;display:flex;align-items:center}
  #nav .rail button{pointer-events:auto;background:none;border:0;cursor:pointer;
    font:inherit;letter-spacing:inherit;color:#8a857a;padding:6px 2px;transition:color .4s}
  #nav .rail button.on{color:var(--ink)}
  #nav .rail button.open{color:var(--ink2)}
  #nav .rail button.open.on{color:var(--ink)}
  #nav .rail i{flex:1;height:1px;background:rgba(28,28,26,.30);position:relative;overflow:hidden}
  #nav .rail i b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink)}
  #nav .snd{pointer-events:auto;background:none;border:0;cursor:pointer;font:inherit;
    letter-spacing:inherit;color:var(--ink2);white-space:nowrap;padding:6px 0}
  #nav .snd:hover{color:var(--ink)}
  @media (max-width:760px){
    #nav{gap:12px;padding:12px 14px}
    #nav .brand{display:none}
    .act.doorlbl{padding:0 7vw 12vh 6vw}
  }

  #nogl{position:fixed;inset:0;z-index:9;display:none;place-items:center;
    background:var(--paper);text-align:center;padding:2rem}
  #nogl p{max-width:520px;color:var(--ink2);line-height:1.7;
    font-family:var(--fallback);font-size:.95rem}

  @media (prefers-reduced-motion:reduce){ .hint{animation:none} }

/* ================================================================
   THE OPENING — supplied component (opening/7y7w-opening.js).
   Pinned like a fixed screen so it contributes no document height: the
   corridor derives every world's position from total scroll, so height
   added here would move all seven.
   ================================================================ */
y7w-opening{position:fixed;inset:0;z-index:8;height:100svh;--y7w-accent:#975017}
/* ================================================================
   THE NOTE — read while drifting through the entrance chamber.
   ================================================================ */
.sbeat{justify-content:center;gap:1.15rem;padding:12vh 8vw}
.sbeat::before{content:'';position:absolute;inset:0;z-index:-1;
  background:radial-gradient(ellipse 56% 44% at 50% 50%,
    rgba(251,250,247,.86) 0%,rgba(251,250,247,.5) 55%,rgba(251,250,247,0) 100%)}
.sbeat .eyebrow{font-family:var(--display);font-size:.68rem;
  letter-spacing:.36em;text-transform:uppercase;color:var(--ink2)}
.sbeat h2{font-family:var(--display);font-weight:400;
  font-size:clamp(1.9rem,5.2vw,4rem);line-height:1.16;color:var(--ink);
  letter-spacing:.02em;max-width:18ch;text-wrap:balance}
.sbeat h2 em{font-style:normal;color:var(--clay)}
.sbeat p{font-family:var(--display);
  font-size:clamp(1.1rem,2.1vw,1.7rem);line-height:1.6;letter-spacing:.025em;
  color:var(--ink);max-width:40ch;text-wrap:pretty}
.sbeat p.lead{color:#2b2823}
.sbeat p.quiet{font-family:var(--display);font-style:normal;
  font-size:clamp(.95rem,1.4vw,1.15rem);line-height:1.95;letter-spacing:.055em;
  color:var(--ink2);max-width:52ch}
.sbeat .cta{pointer-events:auto;margin-top:1.1rem;cursor:pointer;
  background:none;border:1px solid rgba(28,28,26,.45);border-radius:999px;
  padding:.85rem 1.9rem;font-family:var(--display);
  font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);
  transition:background .35s,color .35s,border-color .35s}
.sbeat .cta:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sbeat .cta:focus-visible{outline:1px solid var(--clay);outline-offset:5px}
@media (max-width:760px){
  .sbeat{padding:10vh 7vw;gap:1rem}
  .sbeat p{max-width:32ch}
}

</style>
</head>
